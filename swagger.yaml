openapi: 3.0.0

info:
  title: API Samara Joias
  description: API REST do e-commerce Samara Joias
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Servidor local

paths:

  /cadastro:
    post:
      summary: Cadastrar novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - email
                - senha
              properties:
                nome:
                  type: string
                  example: Ana Silva
                email:
                  type: string
                  example: ana@email.com
                senha:
                  type: string
                  example: "123456"
      responses:
        '201':
          description: Cadastro realizado com sucesso
        '400':
          description: Dados inválidos ou e-mail já cadastrado

  /login:
    post:
      summary: Realizar login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - senha
              properties:
                email:
                  type: string
                  example: cliente@teste.com
                senha:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Login realizado com sucesso
        '400':
          description: Dados não informados
        '401':
          description: E-mail ou senha incorretos

  /produtos:
    get:
      summary: Listar produtos
      responses:
        '200':
          description: Lista de produtos retornada com sucesso

  /carrinho:
    post:
      summary: Adicionar produto ao carrinho
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuarioId
                - produtoId
                - quantidade
              properties:
                usuarioId:
                  type: integer
                  example: 1
                produtoId:
                  type: integer
                  example: 1
                quantidade:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Produto adicionado ao carrinho
        '400':
          description: Dados inválidos ou estoque insuficiente

  /carrinho/{usuarioId}:
    get:
      summary: Consultar carrinho de um usuário
      parameters:
        - in: path
          name: usuarioId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Carrinho consultado com sucesso
        '404':
          description: Usuário não encontrado

  /carrinho/{usuarioId}/{produtoId}:
    delete:
      summary: Remover produto do carrinho
      parameters:
        - in: path
          name: usuarioId
          required: true
          schema:
            type: integer
        - in: path
          name: produtoId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Produto removido do carrinho
        '404':
          description: Carrinho ou produto não encontrado

  /finalizar-compra:
    post:
      summary: Finalizar compra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuarioId
                - pagamento
              properties:
                usuarioId:
                  type: integer
                  example: 1
                pagamento:
                  type: string
                  enum:
                    - PIX
                    - Cartão de crédito
                    - Dinheiro
                  example: Dinheiro
      responses:
        '200':
          description: Compra finalizada com sucesso
        '400':
          description: Dados inválidos, carrinho vazio ou estoque insuficiente

  /pedidos/{usuarioId}:
    get:
      summary: Consultar pedidos de um usuário
      parameters:
        - in: path
          name: usuarioId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pedidos do usuário retornados com sucesso
        '404':
          description: Usuário não encontrado